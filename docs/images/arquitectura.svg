<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Cámara Xiaomi → go2rtc → Home Assistant</text>

  <!-- Cloud -->
  <rect x="330" y="62" width="300" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Nube Xiaomi (Mi Home)</text>
  <text x="480" y="114" text-anchor="middle" font-size="13" fill="#78350f">solo login + claves de cifrado</text>

  <!-- LAN box -->
  <rect x="20" y="160" width="920" height="340" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="36" y="184" font-size="13" fill="#475569">Tu red local (LAN)</text>

  <!-- Camera -->
  <rect x="44" y="250" width="170" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="129" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Cámara Xiaomi</text>
  <text x="129" y="307" text-anchor="middle" font-size="12" fill="#0c4a6e">chuangmi.camera.ipc019</text>
  <text x="129" y="327" text-anchor="middle" font-size="12" fill="#0c4a6e">sin RTSP de fábrica</text>
  <text x="129" y="347" text-anchor="middle" font-size="12" fill="#0c4a6e">vídeo H.265 + audio</text>

  <!-- go2rtc -->
  <rect x="300" y="210" width="330" height="200" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="465" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Complemento go2rtc (master)</text>
  <rect x="320" y="254" width="290" height="58" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="465" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">stream «entrada»</text>
  <text x="465" y="297" text-anchor="middle" font-size="12" fill="#064e3b">xiaomi:// · H.265 original · precargado</text>
  <rect x="320" y="330" width="290" height="58" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="465" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">stream «entrada_h264»</text>
  <text x="465" y="373" text-anchor="middle" font-size="12" fill="#064e3b">ffmpeg → H.264 (compatible con todo)</text>
  <line x1="465" y1="312" x2="465" y2="328" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>

  <!-- HA -->
  <rect x="716" y="250" width="200" height="110" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="816" y="283" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Home Assistant</text>
  <text x="816" y="305" text-anchor="middle" font-size="12" fill="#312e81">Generic Camera</text>
  <text x="816" y="325" text-anchor="middle" font-size="12" fill="#312e81">camera.entrada</text>
  <text x="816" y="345" text-anchor="middle" font-size="12" fill="#312e81">móvil · PC · tablets</text>

  <!-- Arrows -->
  <line x1="216" y1="305" x2="298" y2="283" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="226" y="258" font-size="12" fill="#334155">P2P local</text>
  <text x="226" y="274" font-size="12" fill="#334155">(CS2/TUTK)</text>

  <line x1="612" y1="283" x2="714" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="276" font-size="11" fill="#334155">JPEG</text>
  <line x1="612" y1="359" x2="714" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="632" y="372" font-size="11" fill="#334155">RTSP</text>
  <text x="632" y="386" font-size="11" fill="#334155">:8554</text>

  <line x1="440" y1="208" x2="440" y2="134" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <line x1="200" y1="248" x2="340" y2="134" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="452" y="176" font-size="12" fill="#92400e">token / claves</text>

  <text x="480" y="480" text-anchor="middle" font-size="13" fill="#475569">El vídeo nunca sale de tu casa: la nube solo se usa para autenticar y obtener las claves.</text>
</svg>
